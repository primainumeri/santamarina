<!DOCTYPE html>
<html lang="it" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aggiornamenti — Prima i numeri, poi il cemento</title>
    <meta name="description" content="Archivio completo degli aggiornamenti tecnici sul PUC di Santa Marina." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-brand-sand text-slate-800">
    <header class="sticky top-0 z-50 border-b border-slate-200 bg-white/95 backdrop-blur">
      <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between py-3">
          <a href="./index.html#hero" class="text-sm font-extrabold uppercase tracking-wide text-brand-navy" aria-label="Torna alla pagina principale">
            Prima i numeri
          </a>
          <nav aria-label="Navigazione principale" class="hidden md:flex md:flex-wrap md:items-center md:gap-x-5 md:gap-y-1">
            <a href="./index.html#breve" class="text-sm font-semibold text-slate-700 transition hover:text-brand-blue">In breve</a>
            <a href="./aggiornamenti.html" class="rounded-lg bg-brand-green px-3 py-2 text-sm font-semibold text-white transition hover:opacity-90">Aggiornamenti</a>
            <a href="./index.html#documenti" class="text-sm font-semibold text-slate-700 transition hover:text-brand-blue">Documenti</a>
            <a href="./index.html#contribuisci" class="rounded-lg bg-brand-blue px-3 py-2 text-sm font-semibold text-white transition hover:opacity-90">Contribuisci</a>
          </nav>
        </div>
      </div>
    </header>

    <main>
      <section class="mx-auto max-w-6xl px-4 py-14 sm:px-6 lg:px-8" aria-labelledby="aggiornamenti-h1">
        <p class="text-xs font-bold uppercase tracking-[0.22em] text-brand-blue">Archivio completo</p>
        <h1 id="aggiornamenti-h1" class="mt-2 text-3xl font-black uppercase text-brand-navy sm:text-4xl">
          Tutti gli aggiornamenti
        </h1>
        <p class="mt-4 max-w-3xl text-lg leading-8 text-slate-700">
          In questa pagina trovi tutti gli aggiornamenti disponibili in ordine cronologico.
        </p>
        <div
          data-share-block
          data-share-url="https://santamarina.primainumeri.it/aggiornamenti.html"
          data-share-title="Aggiornamenti — Prima i numeri, poi il cemento"
          class="mt-6 max-w-3xl rounded-2xl border border-slate-200 bg-white p-4 shadow-soft"
        >
          <p class="text-xs font-bold uppercase tracking-[0.22em] text-brand-blue">Condividi questa pagina</p>
          <div class="mt-3 flex flex-wrap gap-2">
            <button
              type="button"
              data-share-native
              class="hidden rounded-xl bg-brand-blue px-4 py-2 text-sm font-bold text-white transition hover:opacity-90"
            >
              Condividi
            </button>
            <a
              href="#"
              data-share-whatsapp
              class="rounded-xl bg-brand-green px-4 py-2 text-sm font-bold text-white transition hover:opacity-90"
            >
              WhatsApp
            </a>
            <a
              href="#"
              data-share-facebook
              class="rounded-xl bg-brand-navy px-4 py-2 text-sm font-bold text-white transition hover:bg-brand-blue"
            >
              Facebook
            </a>
            <a
              href="#"
              data-share-email
              class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-bold text-slate-700 transition hover:border-brand-navy hover:text-brand-navy"
            >
              Email
            </a>
            <button
              type="button"
              data-share-copy
              class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-bold text-slate-700 transition hover:border-brand-navy hover:text-brand-navy"
            >
              Copia link
            </button>
          </div>
          <p data-share-feedback class="mt-2 hidden text-sm text-slate-600" aria-live="polite"></p>
        </div>
        <div id="updates-grid" class="mt-8 grid gap-6 lg:grid-cols-2"></div>
      </section>
    </main>

    <footer class="border-t border-slate-200 bg-brand-navy text-white">
      <div class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
        <p class="text-sm text-slate-300">
          <a href="./index.html" class="underline underline-offset-2 hover:text-white">Torna alla pagina principale</a>
        </p>
      </div>
    </footer>

    <script src="data.js"></script>
    <script>
      "use strict";

      (function () {
        var grid = document.getElementById("updates-grid");
        if (!grid) return;
        var updates = (typeof UPDATES !== "undefined") ? UPDATES.slice() : [];
        updates.sort(function (a, b) {
          return String(b.dateISO || "").localeCompare(String(a.dateISO || ""));
        });

        updates.forEach(function (item) {
          var card = document.createElement("article");
          card.className = "rounded-3xl border border-slate-200 bg-white p-8 shadow-soft";
          var date = document.createElement("p");
          date.className = "text-xs font-bold uppercase tracking-[0.22em] text-brand-blue";
          date.textContent = item.dateLabel || "";
          var title = document.createElement("h2");
          title.className = "mt-2 text-2xl font-black uppercase text-brand-navy";
          title.textContent = item.title || "";
          var body = document.createElement("div");
          body.className = "mt-5 space-y-4 leading-8 text-slate-700";
          (item.paragraphs || []).forEach(function (entry) {
            var p = document.createElement("p");
            if (entry && typeof entry === "object" && entry.linkHref && entry.linkLabel) {
              p.appendChild(document.createTextNode(entry.textBefore || ""));
              var a = document.createElement("a");
              a.href = entry.linkHref;
              a.className = "font-semibold text-brand-blue underline underline-offset-2 hover:text-brand-navy";
              a.textContent = entry.linkLabel;
              p.appendChild(a);
              p.appendChild(document.createTextNode(entry.textAfter || ""));
            } else {
              p.textContent = String(entry || "");
            }
            body.appendChild(p);
          });
          card.appendChild(date);
          card.appendChild(title);
          card.appendChild(body);
          grid.appendChild(card);
        });
      })();

      (function () {
        function fallbackCopy(text) {
          var area = document.createElement("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.position = "absolute";
          area.style.left = "-9999px";
          document.body.appendChild(area);
          area.select();
          document.execCommand("copy");
          document.body.removeChild(area);
        }

        document.querySelectorAll("[data-share-block]").forEach(function (block) {
          var url = block.getAttribute("data-share-url") || window.location.href;
          var title = block.getAttribute("data-share-title") || document.title;
          var text = title + " " + url;
          var whatsapp = block.querySelector("[data-share-whatsapp]");
          var facebook = block.querySelector("[data-share-facebook]");
          var email = block.querySelector("[data-share-email]");
          var nativeBtn = block.querySelector("[data-share-native]");
          var copyBtn = block.querySelector("[data-share-copy]");
          var feedback = block.querySelector("[data-share-feedback]");

          if (whatsapp) whatsapp.href = "https://wa.me/?text=" + encodeURIComponent(text);
          if (facebook) facebook.href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(url);
          if (email) {
            email.href = "mailto:?subject=" + encodeURIComponent(title)
              + "&body=" + encodeURIComponent(title + "\n\n" + url);
          }

          if (nativeBtn && navigator.share) {
            nativeBtn.classList.remove("hidden");
            nativeBtn.addEventListener("click", function () {
              navigator.share({ title: title, text: title, url: url }).catch(function () {});
            });
          }

          if (copyBtn) {
            copyBtn.addEventListener("click", function () {
              var copyAction = navigator.clipboard && navigator.clipboard.writeText
                ? navigator.clipboard.writeText(url)
                : Promise.resolve().then(function () { fallbackCopy(url); });
              copyAction.then(function () {
                if (feedback) {
                  feedback.textContent = "Link copiato.";
                  feedback.classList.remove("hidden");
                }
              });
            });
          }
        });
      })();
    </script>
  </body>
</html>
